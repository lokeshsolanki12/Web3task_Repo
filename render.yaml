# Optional Render Blueprint.
# You can deploy backend and frontend separately for a simple production setup.

services:
  - type: web
    name: youtube-watch-party-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 100 --bind 0.0.0.0:$PORT app:app

  - type: web
    name: youtube-watch-party-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
